# 随机端口，便于本地并行启动
server.port=0

# 日志模板：每个请求线程的日志都带 [requestId]，异步/后台线程通过 MDC 传播同样带值
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-}] %logger{36} - %msg%n
logging.level.com.github.h3yow=INFO

# ===== 请求级可观测性配置 =====
# 入口请求 ID 请求头名
observability.header-name=X-Request-Id
# 详细访问日志采样率 [0,1]；只影响每请求详细日志，次数/耗时指标始终全量
observability.sample.rate=1.0
# 指标时间序列硬上限（endpoint × outcome × reason），超限并入 overflow 桶
observability.metrics.max-series=200
# 业务拒绝 reason 白名单，白名单外取值在指标中收敛为 other
observability.allowed-business-reasons[0]=STOCK_LIMIT
observability.allowed-business-reasons[1]=RISK_BLOCK
# 演示后台任务默认关闭；需要观察 bg- 链路时设为 true
observability.background-job.enabled=false
observability.background-job.fixed-delay-ms=5000
