server.port=0

# --- Request observability settings ---
# Maximum accepted length of an inbound X-Correlation-Id header; longer or
# charset-invalid values are rejected and replaced by an auto- fallback id.
observability.correlation-id-max-length=64
# Hard cap for the endpoint metric label length.
observability.endpoint-max-length=64
# Probability [0.0, 1.0] that a request keeps its latency detail. Every request is
# still counted regardless of this value.
observability.metrics-sampling-rate=1.0
# Defense-in-depth cap on the number of distinct endpoint labels retained.
observability.metrics-max-endpoints=128
# Paths with this prefix are excluded from request metrics (readout/control endpoints).
observability.internal-path-prefix=/internal/

# Make the correlation id visible on every log line via MDC.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] %-24logger{24} : %m%n%wEx
